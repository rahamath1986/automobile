name: Deploy Super Admin Portal to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'web/super_admin_portal/**'
      - '.github/workflows/deploy-super-admin.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Next.js Static Export
        run: |
          cd web/super_admin_portal
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "45d900c4a72cc9b54aa4dedc53210c9a49749221ae7e330ed5f23aa75727ee3a06-0446e5e4-9754-46be-b975-2dd7fc4f052100f130106e069d0f"
          action: "upload"
          app_location: "web/super_admin_portal/out"
          skip_app_build: true
