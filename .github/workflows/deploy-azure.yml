name: Trigger auto deployment for motosaas-api

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-azure.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run .NET Verification Build
        run: dotnet build src/MotoSaaS.Api/MotoSaaS.Api.csproj -c Release

      - name: Lowercase repository owner
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/motosaas-api:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/motosaas-api:${{ github.sha }}

      - name: Check Azure Configuration
        id: azure_check
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          if [ -n "$AZURE_CREDS" ] && [ -n "$AZURE_RG" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Login
        if: steps.azure_check.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        if: steps.azure_check.outputs.configured == 'true'
        run: |
          az containerapp registry set \
            --name motosaas-api \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --server ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}
          az containerapp update \
            --name motosaas-api \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ghcr.io/${{ steps.repo_owner.outputs.owner }}/motosaas-api:latest

      - name: Notify on skipped Azure deployment
        if: steps.azure_check.outputs.configured != 'true'
        run: |
          echo "::notice ::AZURE_CREDENTIALS or AZURE_RESOURCE_GROUP not configured in repository secrets. Docker image published to GHCR successfully."

