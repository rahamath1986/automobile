name: Deploy Admin and Branch Portals to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'web/org_admin_portal/**'
      - 'web/branch_portal/**'
      - '.github/workflows/deploy-portals.yml'
  workflow_dispatch:

jobs:
  deploy_org_admin:
    runs-on: ubuntu-latest
    name: Deploy Dealership Org Admin Portal
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Org Admin Portal
        run: |
          cd web/org_admin_portal
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "6a11ac97e42da0442a226a88643fe8fbe5c2794b56f4e99df63990bb39c9056803-7728ba83-5364-4601-81dd-8725d341bb7800f25040ae84630f"
          action: "upload"
          app_location: "web/org_admin_portal/out"
          skip_app_build: true

  deploy_branch_portal:
    runs-on: ubuntu-latest
    name: Deploy Branch Operations Portal
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Branch Portal
        run: |
          cd web/branch_portal
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "cbb5a2b503dd5f69fac2fd44518981913e3ad6b8e0ffbd45b1be45173e1e373c06-83e4dc2e-44b2-4dd5-a4b9-2761f4e6bfe100f29240b274190f"
          action: "upload"
          app_location: "web/branch_portal/out"
          skip_app_build: true
