<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MotoSaaS Showroom</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b1020; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #fallback {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      color: #c7d2fe; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px;
      text-align: center; padding: 24px; background: radial-gradient(circle at 50% 30%, #1e293b, #0b1020);
    }
  </style>
</head>
<body>
  <div id="fallback">Interactive showroom unavailable on this device.</div>
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="GLTFLoader.js"></script>
  <script src="DRACOLoader.js"></script>
  <script>
    (function () {
      'use strict';

      function post(payload) {
        try {
          if (window.ShowroomBridge && window.ShowroomBridge.postMessage) {
            window.ShowroomBridge.postMessage(payload);
          }
        } catch (e) { /* bridge unavailable */ }
      }

      var renderer, scene, camera, controls, paintMaterials = [], hotspotGroup, proceduralModel;
      var manifest = null;
      var animation = null;
      var activeView = 'hero';
      var hotspotSpheres = [];

      var defaultPresets = {
        hero: { position: { x: 2.4, y: 1.2, z: 2.4 }, target: { x: 0, y: 0.6, z: 0 }, fov: 45 },
        profile: { position: { x: 3.2, y: 0.8, z: 0 }, target: { x: 0, y: 0.6, z: 0 }, fov: 40 },
        cockpit: { position: { x: 0, y: 1.3, z: -0.4 }, target: { x: 0, y: 1.0, z: 0.2 }, fov: 50 },
        rear: { position: { x: -2.2, y: 1.0, z: -2.0 }, target: { x: 0, y: 0.6, z: 0 }, fov: 45 },
        top: { position: { x: 0, y: 3.5, z: 0.1 }, target: { x: 0, y: 0.6, z: 0 }, fov: 45 }
      };

      function init() {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        scene.background = new THREE.Color('#0b1020');
        scene.fog = new THREE.Fog('#0b1020', 8, 16);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(2.4, 1.2, 2.4);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0.6, 0);
        controls.minPolarAngle = THREE.MathUtils.degToRad(5);
        controls.maxPolarAngle = THREE.MathUtils.degToRad(75);
        controls.minDistance = 1.5;
        controls.maxDistance = 6.0;
        controls.enablePan = false;

        scene.add(new THREE.HemisphereLight('#dbeafe', '#0b1020', 1.1));
        var key = new THREE.DirectionalLight('#ffffff', 1.5);
        key.position.set(4, 6, 4);
        key.castShadow = true;
        key.shadow.mapSize.set(1024, 1024);
        scene.add(key);
        var rim = new THREE.DirectionalLight('#7dd3fc', 0.8);
        rim.position.set(-5, 3, -4);
        scene.add(rim);

        var floor = new THREE.Mesh(
          new THREE.CircleGeometry(6, 64),
          new THREE.MeshStandardMaterial({ color: '#111827', roughness: 0.65, metalness: 0.15 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        var ring = new THREE.Mesh(
          new THREE.RingGeometry(1.8, 1.86, 64),
          new THREE.MeshBasicMaterial({ color: '#38bdf8', transparent: true, opacity: 0.4, side: THREE.DoubleSide })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.005;
        scene.add(ring);

        proceduralModel = buildProceduralMotorcycle();
        scene.add(proceduralModel);

        hotspotGroup = new THREE.Group();
        scene.add(hotspotGroup);

        renderer.domElement.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('resize', onResize);
        animate();
        post(JSON.stringify({ type: 'ready' }));
      }

      function buildProceduralMotorcycle() {
        var group = new THREE.Group();
        paintMaterials = [];

        // --- Materials ---
        var paint = new THREE.MeshStandardMaterial({
          color: '#002c6c',
          roughness: 0.22,
          metalness: 0.65,
          envMapIntensity: 1.2
        });
        paintMaterials.push(paint);

        var tireRubber = new THREE.MeshStandardMaterial({
          color: '#15171e',
          roughness: 0.85,
          metalness: 0.08
        });

        var wheelRimMat = new THREE.MeshStandardMaterial({
          color: '#0f172a',
          roughness: 0.35,
          metalness: 0.8
        });

        var rimLipMat = new THREE.MeshStandardMaterial({
          color: '#cbd5e1',
          roughness: 0.15,
          metalness: 0.95
        });

        var brakeDiscMat = new THREE.MeshStandardMaterial({
          color: '#e2e8f0',
          roughness: 0.28,
          metalness: 0.9,
          side: THREE.DoubleSide
        });

        var caliperGold = new THREE.MeshStandardMaterial({
          color: '#d97706',
          roughness: 0.3,
          metalness: 0.8
        });

        var frameAlum = new THREE.MeshStandardMaterial({
          color: '#64748b',
          roughness: 0.35,
          metalness: 0.85
        });

        var forkGold = new THREE.MeshStandardMaterial({
          color: '#eab308',
          roughness: 0.18,
          metalness: 0.88
        });

        var engineMetal = new THREE.MeshStandardMaterial({
          color: '#334155',
          roughness: 0.45,
          metalness: 0.75
        });

        var exhaustStainless = new THREE.MeshStandardMaterial({
          color: '#94a3b8',
          roughness: 0.2,
          metalness: 0.92
        });

        var exhaustCarbon = new THREE.MeshStandardMaterial({
          color: '#1e293b',
          roughness: 0.6,
          metalness: 0.3
        });

        var seatLeather = new THREE.MeshStandardMaterial({
          color: '#1e2029',
          roughness: 0.92,
          metalness: 0.05
        });

        var windscreenGlass = new THREE.MeshStandardMaterial({
          color: '#38bdf8',
          roughness: 0.05,
          metalness: 0.1,
          transparent: true,
          opacity: 0.45
        });

        var headlightLED = new THREE.MeshStandardMaterial({
          color: '#ffffff',
          emissive: '#e2e8f0',
          emissiveIntensity: 0.9,
          roughness: 0.1
        });

        var drlCyan = new THREE.MeshStandardMaterial({
          color: '#38bdf8',
          emissive: '#0284c7',
          emissiveIntensity: 0.95
        });

        var taillightRed = new THREE.MeshStandardMaterial({
          color: '#ef4444',
          emissive: '#dc2626',
          emissiveIntensity: 0.9
        });

        var springYellow = new THREE.MeshStandardMaterial({
          color: '#facc15',
          roughness: 0.3,
          metalness: 0.5
        });

        var tftScreen = new THREE.MeshStandardMaterial({
          color: '#0284c7',
          emissive: '#0369a1',
          emissiveIntensity: 0.8,
          roughness: 0.2
        });

        function add(mesh) {
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          group.add(mesh);
          return mesh;
        }

        function createWheel(isFront) {
          var wheelGroup = new THREE.Group();
          var zPos = isFront ? 0.88 : -0.84;
          var tireRadius = 0.38;
          var tireThickness = isFront ? 0.082 : 0.098;

          // Tire
          var tire = new THREE.Mesh(new THREE.TorusGeometry(tireRadius, tireThickness, 24, 48), tireRubber);
          tire.rotation.y = Math.PI / 2;
          tire.castShadow = true;
          wheelGroup.add(tire);

          // Outer rim lip
          var rimLip = new THREE.Mesh(new THREE.TorusGeometry(tireRadius * 0.78, 0.022, 16, 48), rimLipMat);
          rimLip.rotation.y = Math.PI / 2;
          wheelGroup.add(rimLip);

          // Center Hub
          var hub = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, isFront ? 0.14 : 0.18, 24), wheelRimMat);
          hub.rotation.z = Math.PI / 2;
          hub.castShadow = true;
          wheelGroup.add(hub);

          // 10-Spoke Alloy Wheels (5 pairs)
          for (var i = 0; i < 5; i++) {
            var angle = (i * Math.PI * 2) / 5;
            for (var pair = -1; pair <= 1; pair += 2) {
              var spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.016, tireRadius * 0.75, 12), wheelRimMat);
              spoke.rotation.x = angle + pair * 0.12;
              spoke.position.y = (tireRadius * 0.38) * Math.cos(angle);
              spoke.position.z = (tireRadius * 0.38) * Math.sin(angle);
              spoke.castShadow = true;
              wheelGroup.add(spoke);
            }
          }

          // Brake Disc Rotors
          var discRadius = isFront ? 0.24 : 0.19;
          var discGeom = new THREE.RingGeometry(discRadius * 0.55, discRadius, 36);
          if (isFront) {
            [-0.075, 0.075].forEach(function(xOffset) {
              var disc = new THREE.Mesh(discGeom, brakeDiscMat);
              disc.position.x = xOffset;
              disc.rotation.y = Math.PI / 2;
              wheelGroup.add(disc);

              var caliper = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.09, 0.055), caliperGold);
              caliper.position.set(xOffset * 1.05, 0.18, 0.08);
              caliper.castShadow = true;
              wheelGroup.add(caliper);
            });
          } else {
            var rearDisc = new THREE.Mesh(discGeom, brakeDiscMat);
            rearDisc.position.x = 0.08;
            rearDisc.rotation.y = Math.PI / 2;
            wheelGroup.add(rearDisc);

            var rearCaliper = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.08, 0.05), caliperGold);
            rearCaliper.position.set(0.085, 0.16, -0.06);
            wheelGroup.add(rearCaliper);

            var sprocket = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.015, 32), frameAlum);
            sprocket.position.x = -0.075;
            sprocket.rotation.z = Math.PI / 2;
            wheelGroup.add(sprocket);
          }

          wheelGroup.position.set(0, 0.46, zPos);
          add(wheelGroup);
          return wheelGroup;
        }

        createWheel(true);
        createWheel(false);

        // --- Front Suspension (Inverted USD Forks) ---
        [-0.14, 0.14].forEach(function(x) {
          var upperTube = add(new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.38, 16), forkGold));
          upperTube.position.set(x, 0.72, 0.78);
          upperTube.rotation.x = 0.26;

          var lowerTube = add(new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.34, 16), rimLipMat));
          lowerTube.position.set(x, 0.48, 0.84);
          lowerTube.rotation.x = 0.26;

          var forkBottom = add(new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.08, 0.07), frameAlum));
          forkBottom.position.set(x, 0.45, 0.88);
          forkBottom.rotation.x = 0.26;
        });

        var lowerYoke = add(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.035, 0.08), frameAlum));
        lowerYoke.position.set(0, 0.78, 0.76);
        lowerYoke.rotation.x = 0.26;

        var upperYoke = add(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.035, 0.08), frameAlum));
        upperYoke.position.set(0, 0.94, 0.72);
        upperYoke.rotation.x = 0.26;

        // Front Fender / Hugger (Painted)
        var fender = add(new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.40, 0.17, 24, 1, false, Math.PI * 0.1, Math.PI * 0.8), paint));
        fender.position.set(0, 0.47, 0.88);
        fender.rotation.z = Math.PI / 2;

        // --- Clip-on Handlebars, Grips & Mirrors ---
        [-0.26, 0.26].forEach(function(x) {
          var barAngle = x > 0 ? -0.22 : 0.22;
          var bar = add(new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.18, 12), tireRubber));
          bar.position.set(x, 0.98, 0.68);
          bar.rotation.z = Math.PI / 2;
          bar.rotation.y = barAngle;

          var weight = add(new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.03, 12), frameAlum));
          weight.position.set(x > 0 ? x + 0.09 : x - 0.09, 0.98, 0.68);
          weight.rotation.z = Math.PI / 2;

          var stem = add(new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.16, 8), tireRubber));
          stem.position.set(x * 0.85, 1.05, 0.78);
          stem.rotation.z = x > 0 ? -0.65 : 0.65;
          stem.rotation.x = -0.3;

          var mirrorHousing = add(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.02), tireRubber));
          mirrorHousing.position.set(x > 0 ? x * 1.15 : x * 1.15, 1.12, 0.74);
          mirrorHousing.rotation.y = x > 0 ? -0.25 : 0.25;

          var mirrorFace = add(new THREE.Mesh(new THREE.PlaneGeometry(0.11, 0.05), rimLipMat));
          mirrorFace.position.set(x > 0 ? x * 1.15 : x * 1.15, 1.12, 0.73);
          mirrorFace.rotation.y = (x > 0 ? -0.25 : 0.25) + Math.PI;
        });

        // Digital TFT Instrument Console
        var tftCase = add(new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.09, 0.03), tireRubber));
        tftCase.position.set(0, 1.02, 0.66);
        tftCase.rotation.x = -0.65;

        var tftDisplay = add(new THREE.Mesh(new THREE.PlaneGeometry(0.14, 0.07), tftScreen));
        tftDisplay.position.set(0, 1.025, 0.65);
        tftDisplay.rotation.x = -0.65;

        // --- Supersport Aerodynamic Nose Fairing & Windscreen ---
        var nose = add(new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.44, 16), paint));
        nose.position.set(0, 0.88, 0.92);
        nose.rotation.x = -Math.PI / 3.2;
        nose.scale.set(1.2, 0.9, 0.75);

        // Twin LED Projector Headlights
        [-0.08, 0.08].forEach(function(x) {
          var light = add(new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 16), headlightLED));
          light.position.set(x, 0.82, 0.97);

          var drl = add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.015, 0.04), drlCyan));
          drl.position.set(x * 1.1, 0.87, 0.95);
          drl.rotation.z = x > 0 ? -0.2 : 0.2;
        });

        var screen = add(new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.32, 16, 1, true, 0, Math.PI), windscreenGlass));
        screen.position.set(0, 1.08, 0.76);
        screen.rotation.x = -0.65;
        screen.rotation.z = Math.PI;

        // MotoGP Aerodynamic Downforce Winglets
        [-0.24, 0.24].forEach(function(x) {
          var winglet = add(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 0.16), paint));
          winglet.position.set(x, 0.78, 0.76);
          winglet.rotation.y = x > 0 ? -0.2 : 0.2;
          winglet.rotation.z = x > 0 ? -0.15 : 0.15;

          var wingTip = add(new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.06, 0.14), tireRubber));
          wingTip.position.set(x > 0 ? x + 0.06 : x - 0.06, 0.80, 0.76);
        });

        // --- Sculpted Muscular Fuel Tank ---
        var tankMain = add(new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.18, 0.54, 16), paint));
        tankMain.position.set(0, 0.88, 0.18);
        tankMain.rotation.x = Math.PI / 2.3;
        tankMain.scale.set(1.15, 1.0, 0.85);

        var tankShoulder = add(new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 16), paint));
        tankShoulder.position.set(0, 0.91, 0.32);
        tankShoulder.scale.set(1.1, 0.75, 1.35);

        // Knee-grip fairing flanks
        [-0.22, 0.22].forEach(function(x) {
          var kneePad = add(new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.14, 0.24), tireRubber));
          kneePad.position.set(x, 0.86, 0.18);
          kneePad.rotation.y = x > 0 ? -0.2 : 0.2;
        });

        var capBase = add(new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.015, 16), frameAlum));
        capBase.position.set(0, 1.03, 0.28);
        capBase.rotation.x = -0.25;

        var capCenter = add(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.02, 16), rimLipMat));
        capCenter.position.set(0, 1.038, 0.28);
        capCenter.rotation.x = -0.25;

        var tankPad = add(new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.01, 0.32), tireRubber));
        tankPad.position.set(0, 0.99, 0.12);
        tankPad.rotation.x = 0.32;

        // --- Aluminum Deltabox Twin-Spar Frame ---
        [-0.18, 0.18].forEach(function(x) {
          var mainBeam = add(new THREE.Mesh(new THREE.BoxGeometry(0.065, 0.14, 0.68), frameAlum));
          mainBeam.position.set(x, 0.74, 0.22);
          mainBeam.rotation.x = 0.42;
          mainBeam.rotation.y = x > 0 ? -0.1 : 0.1;

          var pivotPlate = add(new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.22, 0.16), frameAlum));
          pivotPlate.position.set(x, 0.58, -0.16);
        });

        // --- 4-Valve Engine Block, Crankcase & Radiator ---
        var engineBlock = add(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.34, 0.44), engineMetal));
        engineBlock.position.set(0, 0.54, 0.08);

        for (var fin = 0; fin < 5; fin++) {
          var coolingFin = add(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.015, 0.32), frameAlum));
          coolingFin.position.set(0, 0.58 + fin * 0.03, 0.12);
        }

        var clutchCover = add(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.05, 24), engineMetal));
        clutchCover.position.set(0.18, 0.46, -0.04);
        clutchCover.rotation.z = Math.PI / 2;

        var statorCover = add(new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.05, 24), engineMetal));
        statorCover.position.set(-0.18, 0.48, 0.02);
        statorCover.rotation.z = Math.PI / 2;

        var radiator = add(new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.26, 0.04), engineMetal));
        radiator.position.set(0, 0.64, 0.48);
        radiator.rotation.x = 0.22;

        var radMesh = add(new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.24), tireRubber));
        radMesh.position.set(0, 0.64, 0.505);
        radMesh.rotation.x = 0.22;

        var bellyPan = add(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.16, 0.58), paint));
        bellyPan.position.set(0, 0.38, 0.14);
        bellyPan.rotation.x = -0.08;

        [-0.21, 0.21].forEach(function(x) {
          var sideFairing = add(new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.36, 0.62), paint));
          sideFairing.position.set(x, 0.68, 0.38);
          sideFairing.rotation.y = x > 0 ? -0.12 : 0.12;
        });

        // --- Performance Stainless Steel Exhaust System ---
        var header = add(new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.42, 16), exhaustStainless));
        header.position.set(0.10, 0.44, 0.28);
        header.rotation.x = Math.PI / 3;

        var collector = add(new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.10, 0.26), exhaustStainless));
        collector.position.set(0.12, 0.33, -0.04);

        var silencer = add(new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.085, 0.58, 20), exhaustStainless));
        silencer.position.set(0.24, 0.48, -0.48);
        silencer.rotation.x = -Math.PI / 3.4;
        silencer.rotation.y = 0.15;

        var heatShield = add(new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.28, 16, 1, true, 0, Math.PI), exhaustCarbon));
        heatShield.position.set(0.25, 0.46, -0.42);
        heatShield.rotation.x = -Math.PI / 3.4;
        heatShield.rotation.z = Math.PI / 2;

        var exhaustTip = add(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.06, 16), rimLipMat));
        exhaustTip.position.set(0.27, 0.66, -0.71);
        exhaustTip.rotation.x = -Math.PI / 3.4;

        // --- Rear Swingarm & Monoshock Suspension ---
        [-0.14, 0.14].forEach(function(x) {
          var arm = add(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.09, 0.72), frameAlum));
          arm.position.set(x, 0.47, -0.48);
          arm.rotation.x = -0.14;
        });

        var shockBody = add(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.26, 16), frameAlum));
        shockBody.position.set(0, 0.62, -0.28);
        shockBody.rotation.x = 0.52;

        var shockSpring = add(new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, 0.20, 16), springYellow));
        shockSpring.position.set(0, 0.62, -0.28);
        shockSpring.rotation.x = 0.52;

        var rearHugger = add(new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.18, 24, 1, false, Math.PI * 0.1, Math.PI * 0.5), tireRubber));
        rearHugger.position.set(0, 0.48, -0.82);
        rearHugger.rotation.z = Math.PI / 2;
        rearHugger.rotation.x = 0.25;

        // --- Split Rider Saddles & Aerodynamic Tail Cowl ---
        var riderSeat = add(new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.09, 0.38), seatLeather));
        riderSeat.position.set(0, 0.81, -0.14);
        riderSeat.rotation.x = 0.18;

        var pillionCowl = add(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.11, 0.36), paint));
        pillionCowl.position.set(0, 0.88, -0.52);
        pillionCowl.rotation.x = 0.24;

        var tailFairing = add(new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.42, 16), paint));
        tailFairing.position.set(0, 0.90, -0.74);
        tailFairing.rotation.x = Math.PI / 1.7;
        tailFairing.scale.set(1.0, 0.6, 1.2);

        [-0.06, 0.06].forEach(function(x) {
          var tailLight = add(new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.045, 0.03), taillightRed));
          tailLight.position.set(x, 0.88, -0.89);
        });

        var tailTidy = add(new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.18, 0.04), tireRubber));
        tailTidy.position.set(0, 0.77, -0.92);
        tailTidy.rotation.x = -0.35;

        var licensePlate = add(new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.08, 0.01), rimLipMat));
        licensePlate.position.set(0, 0.72, -0.95);
        licensePlate.rotation.x = -0.35;

        [-0.22, 0.22].forEach(function(x) {
          var peg = add(new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.10, 12), frameAlum));
          peg.position.set(x > 0 ? x + 0.05 : x - 0.05, 0.54, -0.18);
          peg.rotation.z = Math.PI / 2;

          var heelGuard = add(new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.09, 0.08), rimLipMat));
          heelGuard.position.set(x, 0.58, -0.16);
        });

        group.position.y = 0.02;
        return group;
      }

      function disposeModel(model) {
        if (!model) return;
        model.traverse(function (child) {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material)) child.material.forEach(function (m) { m.dispose(); });
            else child.material.dispose();
          }
        });
      }

      function loadManifest(json) {
        try {
          manifest = JSON.parse(json);
        } catch (e) {
          manifest = null;
        }

        if (manifest) {
          if (manifest.hexCode) setColor(manifest.hexCode);
          buildHotspots(manifest.hotspots || []);
          applyCameraConstraints(manifest.cameraPresets);
        }

        var url = manifest && manifest.glbFileUrl;
        if (url && /^https?:\/\//i.test(url) && /\.(glb|gltf)$/i.test(url)) {
          loadGlb(url);
        } else {
          post(JSON.stringify({ type: 'tier', tier: 'procedural' }));
        }
      }

      function loadGlb(url) {
        var loader = new THREE.GLTFLoader();
        try {
          if (THREE.DRACOLoader) {
            var draco = new THREE.DRACOLoader();
            draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
            loader.setDRACOLoader(draco);
          }
        } catch (e) { /* Draco optional */ }

        var settled = false;
        var timer = setTimeout(function () {
          if (!settled) {
            settled = true;
            post(JSON.stringify({ type: 'tier', tier: 'procedural', reason: 'timeout' }));
          }
        }, 4500);

        loader.load(url, function (gltf) {
          settled = true;
          clearTimeout(timer);
          disposeModel(proceduralModel);
          scene.remove(proceduralModel);
          proceduralModel = gltf.scene;
          proceduralModel.traverse(function (child) {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              if (child.material && child.material.color) paintMaterials.push(child.material);
            }
          });
          scene.add(proceduralModel);
          if (manifest && manifest.hexCode) setColor(manifest.hexCode);
          post(JSON.stringify({ type: 'tier', tier: 'glb' }));
        }, undefined, function () {
          settled = true;
          clearTimeout(timer);
          post(JSON.stringify({ type: 'tier', tier: 'procedural', reason: 'load-error' }));
        });
      }

      function applyCameraConstraints(presets) {
        if (!presets) return;
        var hero = presets.heroView || presets.HeroView;
        if (hero) {
          if (hero.minPolarAngleDeg != null) controls.minPolarAngle = THREE.MathUtils.degToRad(hero.minPolarAngleDeg);
          if (hero.maxPolarAngleDeg != null) controls.maxPolarAngle = THREE.MathUtils.degToRad(hero.maxPolarAngleDeg);
          if (hero.minDistanceMeters != null) controls.minDistance = hero.minDistanceMeters;
          if (hero.maxDistanceMeters != null) controls.maxDistance = hero.maxDistanceMeters;
        }
      }

      function setColor(hex) {
        if (!hex) return;
        try {
          paintMaterials.forEach(function (material) {
            if (material && material.color) material.color.set(hex);
          });
          post(JSON.stringify({ type: 'color', hex: hex }));
        } catch (e) { /* ignore invalid hex */ }
      }

      function resolvePreset(key) {
        var presets = manifest && manifest.cameraPresets;
        var name = key.charAt(0).toUpperCase() + key.slice(1) + 'View';
        var preset = presets && (presets[name] || presets[key]);
        if (!preset && presets) {
          var lower = key.toLowerCase();
          preset = presets[lower + 'View'] || presets[lower];
        }
        return preset || defaultPresets[key] || defaultPresets.hero;
      }

      function setView(key) {
        activeView = key;
        var preset = resolvePreset(key);
        var position = preset.position || defaultPresets.hero.position;
        var target = preset.target || defaultPresets.hero.target;
        animateCamera(
          { x: position.x, y: position.y, z: position.z },
          { x: target.x, y: target.y, z: target.z },
          preset.fov || camera.fov
        );
        post(JSON.stringify({ type: 'view', view: key }));
      }

      function animateCamera(toPosition, toTarget, toFov) {
        var fromPosition = camera.position.clone();
        var fromTarget = controls.target.clone();
        var fromFov = camera.fov;
        var start = performance.now();
        var duration = 650;
        if (animation) cancelAnimationFrame(animation);
        function tick(now) {
          var t = Math.min((now - start) / duration, 1);
          var e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          camera.position.lerpVectors(fromPosition, new THREE.Vector3(toPosition.x, toPosition.y, toPosition.z), e);
          controls.target.lerpVectors(fromTarget, new THREE.Vector3(toTarget.x, toTarget.y, toTarget.z), e);
          camera.fov = fromFov + (toFov - fromFov) * e;
          camera.updateProjectionMatrix();
          controls.update();
          if (t < 1) animation = requestAnimationFrame(tick);
        }
        animation = requestAnimationFrame(tick);
      }

      function reset() {
        setView('hero');
      }

      function buildHotspots(hotspots) {
        while (hotspotGroup.children.length) {
          var child = hotspotGroup.children.pop();
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        }
        hotspotSpheres = [];
        hotspots.forEach(function (hotspot) {
          var position = hotspot.position || { x: 0, y: 0.7, z: 0 };
          var sphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.045, 16, 12),
            new THREE.MeshStandardMaterial({ color: '#38bdf8', emissive: '#0284c7', emissiveIntensity: 1.2 })
          );
          sphere.position.set(position.x, position.y + 0.05, position.z);
          sphere.userData.hotspotId = hotspot.id;
          hotspotGroup.add(sphere);
          hotspotSpheres.push(sphere);

          var halo = new THREE.Mesh(
            new THREE.SphereGeometry(0.085, 16, 12),
            new THREE.MeshBasicMaterial({ color: '#38bdf8', transparent: true, opacity: 0.18 })
          );
          halo.position.copy(sphere.position);
          halo.userData.hotspotId = hotspot.id;
          hotspotGroup.add(halo);
        });
      }

      function onPointerDown(event) {
        if (!hotspotSpheres.length) return;
        var rect = renderer.domElement.getBoundingClientRect();
        var mouse = new THREE.Vector2(
          ((event.clientX - rect.left) / rect.width) * 2 - 1,
          -((event.clientY - rect.top) / rect.height) * 2 + 1
        );
        var raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        var hits = raycaster.intersectObjects(hotspotSpheres.concat(hotspotGroup.children), false);
        if (hits.length && hits[0].object.userData.hotspotId) {
          post(JSON.stringify({ type: 'hotspot', id: hits[0].object.userData.hotspotId }));
        }
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update();
        if (hotspotGroup) {
          hotspotGroup.children.forEach(function (child, index) {
            if (child.material && child.material.opacity != null && child.material.transparent) {
              child.material.opacity = 0.14 + (Math.sin(performance.now() / 500 + index) + 1) * 0.08;
            }
          });
        }
        if (renderer && scene && camera) renderer.render(scene, camera);
      }

      window.showroom = {
        load: loadManifest,
        setColor: setColor,
        setView: setView,
        reset: reset,
        tier: function () { return 'procedural'; }
      };

      try {
        init();
      } catch (e) {
        document.getElementById('fallback').style.display = 'flex';
        post(JSON.stringify({ type: 'error', message: String(e) }));
      }
    })();
  </script>
</body>
</html>
